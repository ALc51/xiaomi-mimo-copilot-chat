name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies --baseContentUrl https://github.com/ALc51/xiaomi-mimo-copilot-chat/raw/main/ --baseImagesUrl https://github.com/ALc51/xiaomi-mimo-copilot-chat/raw/main/
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
